# Generate the Xcode project with `xcodegen generate` (Hearvia.xcodeproj is not checked in).
name: Hearvia
options:
  bundleIdPrefix: dev.hewig
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: V28VJH6B6S
    MARKETING_VERSION: "0.1"
    # Debug builds stay at 1; `just upload-ios` passes a timestamp so every upload is unique.
    CURRENT_PROJECT_VERSION: "1"
packages:
  HearviaKit:
    path: HearviaKit
targets:
  Hearvia:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes: ["Tests/**", "UITests/**"]
      - path: Apps/Shared/DevSecrets.generated.swift
        optional: true
    dependencies:
      - package: HearviaKit
        product: HearviaKit
      - target: HearviaWidgets
    preBuildScripts:
      - name: Generate dev secrets
        script: sh "$SRCROOT/scripts/gen_dev_secrets.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Strip developer Info.plist keys from Release
        script: sh "$SRCROOT/scripts/strip_release_plist.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Hearvia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Hearvia listens to the microphone to show live translated subtitles of speech around you.
        NSSpeechRecognitionUsageDescription: Hearvia turns speech into text on this device to show subtitles.
        ITSAppUsesNonExemptEncryption: false # Only HTTPS/WSS.
        UIBackgroundModes: [screen-capture, audio]
        # Long-press the app icon; handled by QuickActionSceneDelegate.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: dev.hewig.hearvia.start.otherApps
            UIApplicationShortcutItemTitle: Listen to Other Apps
            UIApplicationShortcutItemIconSymbolName: square.grid.2x2
          - UIApplicationShortcutItemType: dev.hewig.hearvia.start.microphone
            UIApplicationShortcutItemTitle: Listen to Microphone
            UIApplicationShortcutItemIconSymbolName: mic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hewig.hearvia
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
  HearviaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/iOSWidgets
      # The intent and its source enum are shared with the app, where the intent runs.
      - path: Apps/iOS/QuickStart/StartListeningIntent.swift
      - path: Apps/iOS/App/InputSource.swift
    dependencies:
      - package: HearviaKit
        product: HearviaKit
    info:
      path: Apps/iOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hearvia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hewig.hearvia.widgets
        GENERATE_INFOPLIST_FILE: NO
  HearviaMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared/DevSecrets.generated.swift
        optional: true
    dependencies:
      - package: HearviaKit
        product: HearviaKit
    preBuildScripts:
      - name: Generate dev secrets
        script: sh "$SRCROOT/scripts/gen_dev_secrets.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Hearvia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false # Only HTTPS/WSS.
        LSApplicationCategoryType: public.app-category.productivity
        NSAudioCaptureUsageDescription: Hearvia listens to other apps' audio to show live translated subtitles.
        NSMicrophoneUsageDescription: Hearvia listens to the microphone to show live translated subtitles.
        NSSpeechRecognitionUsageDescription: Hearvia turns speech into text on this Mac to show subtitles.
    settings:
      base:
        PRODUCT_NAME: Hearvia
        PRODUCT_BUNDLE_IDENTIFIER: dev.hewig.hearvia # Shared with iOS: one App Store record, universal purchase.
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Hearvia.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
  HearviaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/iOS/Tests]
    dependencies:
      - target: Hearvia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HearviaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/iOS/UITests]
    dependencies:
      - target: Hearvia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HearviaMac:
    build:
      targets:
        HearviaMac: all
    run:
      commandLineArguments:
        "--verbose": true
  Hearvia:
    build:
      targets:
        Hearvia: all
    test:
      targets: [HearviaTests, HearviaUITests]
